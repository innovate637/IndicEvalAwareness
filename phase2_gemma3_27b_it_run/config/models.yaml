# Phase-2 model set. Resource rows are re-derived for THIS cluster;
# deviations are marked [LOCAL].
#
# [LOCAL] Cluster A's `h100_partition` / `h200_partition` partitions do not exist here.
#   This cluster (slurm.conf) has ONE node, <gpu-node>:
#     Gres=gpu:nvidia_h100_nvl:1, gpu:nvidia_h100_nvl_1g.12gb:7
#     PartitionName=full_gpu_partition  (DenyAccounts=<restricted-accounts>)
#     PartitionName=mig_partition   (Default=YES)
#   A 12 GB MIG slice cannot hold any model in this set, so every row targets
#   full_gpu_partition and gres nvidia_h100_nvl:1.
#
# [LOCAL] mem is 32G everywhere, NOT the plan's 120-160G. This is a
#   hard rule and overrides the plan: with no/large --mem this cluster reserves
#   the entire node RAM (~503 GB) and blocks the node for everyone else. Weights
#   live in GPU VRAM; real system-RAM use is a few GB.
#
# [LOCAL] KV arithmetic re-derived for H100 NVL (94 GB, not the plan's 80 GB):
#   Gemma 3 27B KV = 2*62*16*128*2 = 507,904 B = 0.50 MB/token (plan §2.3).
#   0.90 * 94 GB = ~85 GB usable, minus ~54 GB weights, minus ~4 GB activations
#   => ~27 GB KV => ~54,000 KV tokens, roughly double the plan's 80 GB budget.
#   max_model_len 4096 / max_num_seqs 48 are therefore KEPT UNCHANGED and now
#   carry extra headroom rather than less. Do not raise them without redoing
#   this arithmetic.

defaults:
  dtype: bfloat16
  max_model_len: 4096          # see §2.3 KV arithmetic
  gpu_memory_utilization: 0.90
  enforce_eager: true
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  cpus_per_task: 8
  trust_remote_code: false

models:
  - {slug: sarvam-m,         repo: sarvamai/sarvam-m,
     revision: null, kind: instruct, thinking_kwarg: enable_thinking,
     true_system_role: true,  tensor_parallel: 1, partition: full_gpu_partition,
     gres: "gpu:nvidia_h100_nvl:1",
     gpus: 1, mem: 32G, time: "08:00:00", approx_bf16_gb: 47, conditional: false}

  - {slug: mistral-24b-base, repo: mistralai/Mistral-Small-3.1-24B-Base-2503,
     revision: null, kind: base,     thinking_kwarg: null,
     true_system_role: false, tensor_parallel: 1, partition: full_gpu_partition,
     gres: "gpu:nvidia_h100_nvl:1",
     gpus: 1, mem: 32G, time: "08:00:00", approx_bf16_gb: 47, conditional: false}

  # ---- ACTIVE MODEL (user instruction 2026-08-18) --------------------------
